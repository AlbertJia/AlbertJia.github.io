<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多功能搜索</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23007BFF' d='M10 20v-6h4v6h5v-8h3L12 3L2 12h3v8h5z'/%3E%3C/svg%3E" type="image/svg+xml">
    <style>
        /* CSS 变量定义 - 亮色模式 */
        :root {
            --bg-color: #f8f9fa;
            --container-bg: #ffffff;
            --text-color: #212529;
            --primary-color: #007bff;
            --primary-hover-color: #0056b3;
            --border-color: #dee2e6;
            --shadow-color: rgba(0, 0, 0, 0.08);
            --weather-bg: rgba(255, 255, 255, 0.9);
            --secondary-text-color: #6c757d;
        }

        /* CSS 变量定义 - 暗黑模式 */
        [data-theme='dark'] {
            --bg-color: #212529;
            --container-bg: #343a40;
            --text-color: #e9ecef;
            --primary-color: #58a6ff; /* (已修改) 暗黑模式下使用蓝色 */
            --primary-hover-color: #388bfd; /* (已修改) 暗黑模式下的悬停蓝色 */
            --border-color: #495057;
            --shadow-color: rgba(0, 0, 0, 0.3);
            --weather-bg: rgba(52, 58, 64, 0.9);
            --secondary-text-color: #adb5bd;
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* 确保页面至少充满整个视窗高度 */
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            transition: background-color 0.4s ease, color 0.4s ease;
            line-height: 1.6;
        }

        .container {
            text-align: center;
            background: var(--container-bg);
            padding: 50px 30px; /* 增加内边距 */
            border-radius: 12px; /* 稍微圆润的边角 */
            box-shadow: 0 10px 30px var(--shadow-color); /* 更柔和的阴影 */
            width: 90%;
            max-width: 960px; /* 扩大最大宽度 */
            margin: 50px auto; /* (已修改) 移除垂直居中，改为固定的上下边距 */
            position: relative;
            /* flex-grow: 1; (已移除) */
            display: flex;
            flex-direction: column;
            justify-content: center; /* 内部内容也垂直居中 */
            transition: background-color 0.4s ease, box-shadow 0.4s ease;
        }

        h1 {
            margin-bottom: 30px;
            color: var(--primary-color);
            font-size: 2rem; /* 调整字体大小 */
            font-weight: 700;
            min-height: 3.5em; /* 预留更多空间 */
            display: flex;
            flex-direction: column; /* 让诗词和出处垂直排列 */
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: color 0.4s ease;
        }

        #hitokoto-quote {
            display: block;
            margin-bottom: 5px; /* 诗词与出处之间的小间距 */
        }
        #hitokoto-from {
            display: block;
            font-size: 1.1rem; /* 出处字体大小 */
            color: var(--secondary-text-color);
            font-weight: 400;
            transition: color 0.4s ease;
        }

        .search-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin: 20px auto 30px auto; /* 调整搜索框上下间距 */
        }
        .search-box input[type="text"], .search-box select {
            width: 100%;
            padding: 18px; /* 增加输入框和选择框的高度 */
            border: 1px solid var(--border-color);
            border-radius: 8px; /* 更圆润的边角 */
            margin-bottom: 15px;
            outline: none;
            box-sizing: border-box;
            font-size: 1.1rem;
            background-color: var(--container-bg); /* 输入框背景与容器一致 */
            color: var(--text-color);
            transition: border-color 0.3s ease, background-color 0.3s ease, color 0.3s ease;
        }
        .search-box input[type="text"]:focus, .search-box select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25); /* 聚焦时浅蓝色光晕 */
        }
        .search-box input[type="submit"] {
            padding: 16px 35px; /* 增加按钮填充 */
            border: none;
            background-color: var(--primary-color);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .search-box input[type="submit"]:hover {
            background-color: var(--primary-hover-color);
            transform: translateY(-2px); /* 悬停时轻微上浮 */
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
        }
        .search-box input[type="submit"]:active {
            transform: translateY(0);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .links {
            margin-top: 40px; /* 增加与搜索框的间距 */
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px; /* 使用 gap 属性创建间距 */
        }
        .links a {
            padding: 8px 15px; /* 增加链接点击区域 */
            color: var(--primary-color);
            text-decoration: none;
            font-size: 1rem;
            border-bottom: 2px solid transparent; /* 默认透明下划线 */
            transition: color 0.3s ease, border-color 0.3s ease, transform 0.2s ease;
        }
        .links a:hover {
            color: var(--primary-hover-color);
            border-color: var(--primary-hover-color); /* 悬停时显示下划线 */
            transform: translateY(-2px);
        }

        #weather {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--weather-bg);
            padding: 12px 18px;
            border-radius: 8px;
            box-shadow: 0 4px 15px var(--shadow-color);
            font-size: 0.95rem;
            color: var(--text-color);
            transition: background-color 0.4s ease, color 0.4s ease, box-shadow 0.4s ease;
        }
        #datetime {
            font-size: 0.95rem;
            color: var(--secondary-text-color);
            margin-bottom: 20px; /* 调整日期与标题的间距 */
            transition: color 0.4s ease;
        }

        /* 暗黑模式切换按钮 */
        .theme-switch-wrapper {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
        }
        .theme-switch {
            display: inline-block;
            height: 28px;
            position: relative;
            width: 56px;
        }
        .theme-switch input {
            display: none;
        }
        .slider {
            background-color: #ccc;
            bottom: 0;
            cursor: pointer;
            left: 0;
            position: absolute;
            right: 0;
            top: 0;
            transition: 0.4s;
            border-radius: 34px;
        }
        .slider:before {
            background-color: #fff;
            bottom: 4px;
            content: "";
            height: 20px;
            left: 4px;
            position: absolute;
            width: 20px;
            transition: 0.4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--primary-color);
        }
        input:checked + .slider:before {
            transform: translateX(28px);
        }
        /* 切换按钮的图标 */
        .theme-switch-wrapper .icon {
            margin-left: 10px;
            font-size: 1.2rem;
            color: var(--text-color);
        }
        .theme-switch-wrapper .icon.moon { display: none; }
        [data-theme='dark'] .theme-switch-wrapper .icon.sun { display: none; }
        [data-theme='dark'] .theme-switch-wrapper .icon.moon { display: inline-block; }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
                width: 95%;
            }
            h1 {
                font-size: 1.7rem;
            }
            #hitokoto-from {
                font-size: 0.95rem;
            }
            .search-box input[type="text"], .search-box select, .search-box input[type="submit"] {
                padding: 14px;
                font-size: 1rem;
            }
            .links a {
                font-size: 0.9rem;
            }
            #weather, .theme-switch-wrapper {
                top: 15px;
                left: 15px;
                right: 15px;
                padding: 8px 12px;
                font-size: 0.85rem;
            }
            .theme-switch-wrapper {
                justify-content: flex-end;
            }
            #weather {
                left: unset;
                right: 15px; /* 将天气信息放到右侧 */
                top: 60px; /* 避免与切换按钮重叠 */
            }
            .theme-switch-wrapper {
                top: 15px;
                right: 15px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 15px;
            }
            h1 {
                font-size: 1.5rem;
            }
            #hitokoto-from {
                font-size: 0.9rem;
            }
            .links {
                gap: 10px;
            }
            .links a {
                padding: 6px 10px;
            }
            #weather {
                font-size: 0.8rem;
                padding: 6px 10px;
                top: 55px;
            }
            .theme-switch-wrapper {
                top: 10px;
                right: 10px;
            }
        }
    </style>
    <!-- 引入 Remix Icon 字体图标库 --><link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- 暗黑模式切换按钮 --><div class="theme-switch-wrapper">
            <label class="theme-switch" for="checkbox">
                <input type="checkbox" id="checkbox" />
                <div class="slider round"></div>
            </label>
            <span class="icon sun"><i class="ri-sun-line"></i></span>
            <span class="icon moon"><i class="ri-moon-line"></i></span>
        </div>

        <div id="weather">加载天气...</div>
        <div id="datetime"></div>
        
        <h1>
            <span id="hitokoto-quote">正在加载今日诗词...</span>
            <span id="hitokoto-from"></span>
        </h1>
        <form class="search-box" onsubmit="handleSearch(event)">
            <input type="text" id="search-input" placeholder="请输入搜索内容" required>
            <select id="search-engine">
                <option value="baidu">百度</option>
                <option value="google">谷歌</option>
                <option value="cnki">知网</option>
                <option value="googlescholar">谷歌学术搜索</option>
            </select>
            <input type="submit" value="搜索">
        </form>
        <div class="links">
            <a href="https://www.bilibili.com" target="_blank">哔哩哔哩</a>
            <a href="https://www.xiaohongshu.com" target="_blank">小红书</a>
            <a href="https://chat.openai.com" target="_blank">ChatGPT</a>
            <a href="https://gemini.google.com" target="_blank">Gemini</a>
            <a href="https://www.deepseek.com" target="_blank">DeepSeek</a>
            <a href="https://www.doubao.com" target="_blank">豆包</a>
            <a href="https://www.cnipa.gov.cn" target="_blank">国家知识产权局</a>
        </div>
    </div>

    <script>
        // --- 暗黑模式逻辑 ---
        const checkbox = document.getElementById('checkbox');
        const html = document.documentElement;

        // 设置主题
        function setTheme(theme) {
            html.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            checkbox.checked = (theme === 'dark'); // 更新 checkbox 状态
        }

        // 根据系统偏好或本地存储加载主题
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                setTheme(savedTheme);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                setTheme('dark'); // 系统偏好暗色
            } else {
                setTheme('light'); // 默认亮色
            }
        }

        // 切换主题
        checkbox.addEventListener('change', () => {
            if (checkbox.checked) {
                setTheme('dark');
            } else {
                setTheme('light');
            }
        });

        // 页面加载时执行
        loadTheme();

        // --- 其他功能 ---

        // 更新日期和时间
        function updateTime() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            const formattedDate = now.toLocaleDateString('zh-CN', options);
            document.getElementById('datetime').innerText = formattedDate;
        }
        updateTime();
        setInterval(updateTime, 1000);

        // 处理搜索
        function handleSearch(event) {
            event.preventDefault();
            const query = document.getElementById('search-input').value;
            const engine = document.getElementById('search-engine').value;
            let url = '';

            switch(engine) {
                case 'baidu':
                    url = `https://www.baidu.com/s?wd=${encodeURIComponent(query)}`;
                    break;
                case 'google':
                    url = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
                    break;
                case 'cnki':
                    url = `https://kns.cnki.net/kns/search?dbcode=SCDB&kw=${encodeURIComponent(query)}`;
                    break;
                case 'googlescholar':
                    url = `https://scholar.google.com/scholar?hl=zh-CN&q=${encodeURIComponent(query)}`;
                    break;
            }
            window.open(url, '_blank');
        }

        // 获取天气 (注意：API Key 暴露在前端存在安全风险，仅供个人演示使用)
        async function getWeather() {
            const apiKey = '471e204dfc69fde9ca420c81b52ab515';  // OpenWeatherMap API 密钥
            const city = 'BeiJing';  // 目标城市
            const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric&lang=zh_cn`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data && data.weather) {
                    const weather = `${data.name}: ${data.weather[0].description}, 温度: ${data.main.temp}°C`;
                    document.getElementById('weather').innerText = weather;
                } else {
                     document.getElementById('weather').innerText = '天气信息获取异常';
                }
            } catch (error) {
                console.error("Weather fetch error:", error);
                document.getElementById('weather').innerText = '无法获取天气信息';
            }
        }
        
        // 获取“一言”诗词或短句
        async function getHitokoto() {
            const quoteEl = document.getElementById('hitokoto-quote');
            const fromEl = document.getElementById('hitokoto-from');
            
            try {
                const response = await fetch('https://v1.hitokoto.cn/?c=i&c=k&c=d&encode=json');
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                quoteEl.innerText = data.hitokoto;
                if (data.from) {
                    fromEl.innerText = `—— 《${data.from}》`;
                } else {
                    fromEl.innerText = '';
                }
                
            } catch (error) {
                console.error('Failed to fetch hitokoto:', error);
                quoteEl.innerText = '致知在格物';
                fromEl.innerText = '';
            }
        }

        // 页面加载时执行
        getWeather();
        getHitokoto();
    </script>
</body>
</html>
